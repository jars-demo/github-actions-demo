# Chapter 12: keep actions and packages current. A 14-day cooldown means nothing is proposed until
# it has been public for two weeks, the same rule this repository follows by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/setup-backend']
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
